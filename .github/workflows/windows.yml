name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python aetherftp.py --smoke-test
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AetherFTP aetherftp.py
      - name: Verify packaged startup
        shell: pwsh
        run: |
          $process = Start-Process dist\AetherFTP.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'EXE smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'EXE smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AetherFTP-Windows
          path: dist/AetherFTP.exe
          if-no-files-found: error
